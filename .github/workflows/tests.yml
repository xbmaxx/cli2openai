name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser:
    name: parser self-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ---------------------------------------------------------------------
      # Pure-function tests only.
      # No CLI, no network, no launchd, no credentials — safe in CI.
      # (install.sh / verify.sh require a running bridge and a logged-in CLI,
      #  so they are intentionally NOT run here.)
      # ---------------------------------------------------------------------
      - name: Parser self-test (12 cases)
        run: python3 selftest_parser.py

      # Covers bare-argument inference (shape #6), bare tool-name tags (#9),
      # XML <tool name=> (#8) and fabricated <function_results> (#11).
      # --bare must also run the main suite, so a regression in either fails the job.
      - name: Shape #6 / #8 / #9 / #11 self-test (12 cases)
        run: python3 selftest_parser.py --bare
